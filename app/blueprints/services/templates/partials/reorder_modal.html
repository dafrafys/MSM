<!-- Modal réordonnancement -->
<div class="modal fade" id="reorderModal" tabindex="-1" aria-labelledby="reorderModalLabel" aria-hidden="true">
  <div class="modal-dialog" tabindex="-1">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="reorderModalLabel">Réordonner les activités</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <ul id="activityList" class="list-group">
          <!-- Activités listées ici dynamiquement -->
        </ul>
      </div>
      <div class="modal-footer">
        <button type="button" id="saveOrderBtn" class="btn btn-primary">Enregistrer l’ordre</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
      </div>
    </div>
  </div>
</div>
