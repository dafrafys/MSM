
services:
  web:
    build: .
    image: msm-backend:latest
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - "P:/3 - Production:/mnt/p:rw"
      - "Q:/ehs:/mnt/q:ro"
      - "Q:/TPM:/mnt/q:ro"
    depends_on: []
    networks:
      - app-network

